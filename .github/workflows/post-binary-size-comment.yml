name: Post Binary Size Comment

# Runs after "Report Binary Size" completes on a PR.
# workflow_run always executes in the context of the base branch (main),
# so the GITHUB_TOKEN has write access even for fork PRs.

on:
  workflow_run:
    workflows: [ "Report Binary Size" ]
    types: [ completed ]

permissions:
  pull-requests: write

jobs:
  comment:
    name: Post PR comment
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-size-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER=$(gh api "/repos/${{ github.repository }}/pulls?head=${HEAD_OWNER}:${HEAD_BRANCH}&state=open" --jq '.[0].number // empty')
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Could not resolve PR number for ${HEAD_OWNER}:${HEAD_BRANCH}" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: binary-size
          path: binary-size-report.md
          number: ${{ steps.pr.outputs.number }}
