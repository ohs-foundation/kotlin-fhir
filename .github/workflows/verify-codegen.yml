name: Verify Codegen

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-codegen:
    name: Match committed files
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fetch origin/main for Spotless ratchet
        run: git fetch origin main

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify codegen output matches committed sources
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
        run: >-
          ./gradlew verifyCodegen
          --stacktrace
          --no-daemon
          --no-parallel
          --no-configuration-cache
          --build-cache
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=1
          -Dkotlin.daemon.enabled=false
          -Pfhir.android.enabled=false
