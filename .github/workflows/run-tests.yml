name: Run Tests

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches: [ "main" ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    name: Run tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jvmTest
            os: ubuntu-latest
            android: false
          - target: wasmJsBrowserTest
            os: ubuntu-latest
            android: false
          - target: wasmWasiNodeTest
            os: ubuntu-latest
            android: false
          - target: jsBrowserTest
            os: ubuntu-latest
            android: false
          - target: testDebugUnitTest
            os: ubuntu-latest
            android: true
          - target: iosSimulatorArm64Test
            os: macos-latest
            android: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fetch origin/main for Spotless ratchet
        run: git fetch origin main

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Android SDK
        if: matrix.android
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" > /dev/null

      - name: Add swap space
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Cache Kotlin/Native
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/.lock') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
        run: >-
          ./gradlew ${{ matrix.target }}
          --stacktrace
          --no-daemon
          --no-parallel
          --no-configuration-cache
          --build-cache
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=1
          -Dkotlin.daemon.enabled=false
          -Pfhir.android.enabled=${{ matrix.android }}
